name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      HOTELRANK_SYNTHETIC: "1"   # the Kaggle data cannot be redistributed; CI runs on the synthetic table
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt ruff==0.6.9
      - name: Lint
        run: ruff check src tests scripts notebooks
      - name: Tests
        run: pytest -q
      - name: Notebooks on synthetic data
        run: |
          for nb in notebooks/[0-9]*.py; do echo "== $nb"; python "$nb"; done
      - name: Recorded metrics are untouched by synthetic runs
        run: git diff --exit-code reports/metrics
